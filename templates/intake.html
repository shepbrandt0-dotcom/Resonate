{% extends "base.html" %}
{% block title %}Intake · Resonate{% endblock %}
{% block page_emblem %}{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-16">
    <div class="flex items-center gap-4 mb-8">
    <span class="inline-flex bg-white rounded-xl p-2 border border-navy-100 shrink-0">
      <img src="{ url_for('static', filename='img/logo-emblem-light-clean.png') }" alt="" class="h-12 w-auto">
    </span>
    <div>
      <p class="text-xs font-medium text-coral-500 uppercase tracking-wider">Intake</p>
      <h1 class="text-3xl sm:text-4xl font-bold text-navy-900 tracking-tight font-display">Client intake</h1>
    </div>
  </div>

  <p class="text-navy-600 text-sm mb-8">You’ll receive a portal access code after submitting.</p>
  <form method="POST" class="space-y-4">
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="label">Name *</label>
        <input type="text" name="name" required class="input-field">
      </div>
      <div>
        <label class="label">Email *</label>
        <input type="email" name="email" required class="input-field">
      </div>
    </div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="label">Organization</label>
        <input type="text" name="org" class="input-field">
      </div>
      <div>
        <label class="label">Role</label>
        <input type="text" name="role" class="input-field" placeholder="Candidate, Comms Director…">
      </div>
    </div>
    <div>
      <label class="label">Target audience *</label>
      <textarea name="audience" rows="2" required class="input-field"></textarea>
    </div>
    <div>
      <label class="label">Primary goal *</label>
      <textarea name="goal" rows="2" required class="input-field"></textarea>
    </div>
    <div>
      <label class="label">Existing draft (optional)</label>
      <textarea name="existing_draft" rows="4" class="input-field font-mono text-sm"></textarea>
    </div>
    <div>
      <label class="label">Key messages</label>
      <textarea name="key_messages" rows="2" class="input-field"></textarea>
    </div>
    <div>
      <label class="label">Constraints</label>
      <textarea name="constraints" rows="2" class="input-field"></textarea>
    </div>
    <div>
      <label class="label">Tone notes</label>
      <textarea name="tone_notes" rows="2" class="input-field"></textarea>
    </div>
    <button type="submit" class="w-full bg-navy-900 text-white font-medium py-3 rounded text-sm hover:bg-navy-800 transition">Submit intake</button>
  </form>
</div>
{% endblock %}
